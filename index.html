<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>intellearn · Dip.EP (3) ဝင်ခွင့်စာမေးပွဲ Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pyidaungsu";font-weight:400;src:local("Pyidaungsu"),local("Pyidaungsu Regular"),url("Pyidaungsu-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Pyidaungsu";font-weight:700;src:local("Pyidaungsu Bold"),url("Pyidaungsu-Bold.ttf") format("truetype");font-display:swap}
:root{color-scheme:light;--ink:#0d3b2a;--gold:#0b7a47;--cy:#19c37d;--ch:clamp(66px,19vw,104px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(135deg,#ffffff,#e4f8ec 25%,#c8f0da 50%,#f1fcf5 75%,#ffffff);background-size:400% 400%;animation:bg 22s ease-in-out infinite;position:relative;color:var(--ink);font-family:"Pyidaungsu","Padauk","Noto Sans Myanmar","Myanmar Text",sans-serif;overflow-x:hidden;overflow-y:auto}
@keyframes bg{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
.blob{position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.b1{width:320px;height:320px;background:#8be28b;top:-100px;right:-80px}
.b2{width:340px;height:340px;background:#19c37d;bottom:-130px;left:-110px;animation-delay:-6s}
.b3{width:240px;height:240px;background:#b8f0d0;top:40%;left:50%;animation-delay:-10s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-60px,50px) scale(1.25)}}
.sp{position:fixed;bottom:-20px;border-radius:50%;background:#46d28f;box-shadow:0 0 10px 2px rgba(25,195,125,.5);pointer-events:none;z-index:0;opacity:0;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:640px;margin:0 auto;padding:28px 14px;text-align:center;box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.brand{display:inline-flex;align-items:center;gap:8px;align-self:center;margin-bottom:12px;padding:6px 18px 6px 7px;border-radius:40px;background:#fff;border:1px solid rgba(25,195,125,.45);box-shadow:0 6px 18px rgba(11,122,71,.18);animation:in .8s ease both}
.logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0b7a47,#19c37d);display:flex;align-items:center;justify-content:center}
.logo svg{width:18px;height:18px}
.bn{font-family:"Outfit",sans-serif;font-weight:800;font-size:21px;color:#19c37d;letter-spacing:-.3px}
.bn i{font-style:normal;color:#0b6b3a}
.foot{margin-top:18px;font-family:"Outfit",sans-serif;font-size:14px;letter-spacing:1.5px;color:#3f8a64}
.foot b{color:#0b6b3a}
.dip{font-family:"Outfit",sans-serif;font-weight:800;font-size:clamp(46px,13vw,76px);line-height:1.05;margin:0;letter-spacing:-1px;background:linear-gradient(100deg,#0b6b3a,#19c37d 35%,#6fdc9b 65%,#0b6b3a);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;filter:drop-shadow(0 4px 14px rgba(25,195,125,.3))}
@keyframes sh{to{background-position:250% center}}
h1{font-size:clamp(20px,5.4vw,28px);font-weight:700;margin:6px 0 22px;line-height:1.5}
.panel{background:linear-gradient(135deg,#0b7a47,#13b26e 55%,#2fd68f);border:2px solid rgba(255,255,255,.8);border-radius:28px;padding:clamp(16px,4vw,28px) clamp(8px,3vw,24px) clamp(14px,3vw,22px);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:in .9s ease both,glow 3.6s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 14px 40px rgba(11,122,71,.28),0 0 0 rgba(25,195,125,0)}50%{box-shadow:0 18px 54px rgba(11,122,71,.38),0 0 40px rgba(25,195,125,.55)}}
.row{display:flex;justify-content:center;align-items:flex-start;gap:clamp(2px,1.6vw,10px)}
.unit{display:flex;flex-direction:column;align-items:center;gap:12px;flex:1;max-width:120px;animation:rise .9s cubic-bezier(.2,.9,.25,1.15) both,bob 4.6s ease-in-out 1s infinite;animation-delay:var(--d,0s),calc(1s + var(--d,0s))}
.row>:nth-child(3){--d:.12s}.row>:nth-child(5){--d:.24s}.row>:nth-child(7){--d:.36s}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.card{position:relative;width:100%;height:var(--ch);display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;overflow:hidden;perspective:420px;box-shadow:0 10px 22px rgba(0,60,30,.3),0 0 0 2px rgba(255,255,255,.9)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:300% 100%;background-position:150% 0;mix-blend-mode:overlay;animation:sheen 4.5s ease-in-out infinite}
.row>:nth-child(3) .card::after{animation-delay:.4s}.row>:nth-child(5) .card::after{animation-delay:.8s}.row>:nth-child(7) .card::after{animation-delay:1.2s}
@keyframes sheen{0%{background-position:150% 0}40%,100%{background-position:-50% 0}}
.num{font-size:calc(var(--ch)*.54);font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#0b6b3a,#19c37d);-webkit-background-clip:text;background-clip:text;color:transparent;transform-origin:50% 0}
.num.pop{animation:flip .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes flip{0%{transform:rotateX(-85deg);opacity:0}100%{transform:none;opacity:1}}
.colon{height:var(--ch);display:flex;align-items:center;font-size:calc(var(--ch)*.5);font-weight:700;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.8);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}
.lbl{font-size:clamp(15px,4vw,19px);font-weight:700;color:#fff}
.tail{margin:22px 0 0;font-size:clamp(25px,6.6vw,34px);font-weight:700;color:var(--gold);text-shadow:0 0 22px rgba(25,195,125,.35);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.when{margin:14px auto 0;padding:12px 22px;border-radius:18px;font-size:19px;line-height:1.7;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);display:inline-block}
.when b{color:var(--gold)}
.quote{margin:20px auto 0;padding:16px 20px;border-radius:18px;text-align:left;font-family:"Outfit",sans-serif;font-weight:300;font-size:clamp(17px,4.4vw,21px);line-height:1.6;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-left:5px solid var(--cy);transition:opacity .6s,transform .6s}
.quote.out{opacity:0;transform:translateY(8px)}
.clock{margin-top:16px;font-size:16px;opacity:.9}
.track{position:relative;height:14px;margin:24px 4px 0;border-radius:14px;background:rgba(11,122,71,.14);box-shadow:inset 0 2px 6px rgba(11,122,71,.2)}
.fill{position:relative;height:100%;width:0;border-radius:14px;background:linear-gradient(90deg,#0b7a47,#19c37d,#8be28b,#0b7a47);background-size:250% 100%;animation:flow 3s linear infinite;transition:width 1s linear;box-shadow:0 0 14px rgba(25,195,125,.6)}
.fill::before{content:"";position:absolute;inset:0;border-radius:14px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 8px,transparent 8px 18px);opacity:.5}
.fill::after{content:"";position:absolute;right:-8px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(25,195,125,.35),0 0 20px 6px rgba(25,195,125,.7);animation:dot 1.4s ease-in-out infinite}
@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes flow{to{background-position:250% 0}}
.fill.full{box-shadow:0 0 28px rgba(25,195,125,.9);animation:flow 1.2s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sp{display:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3z" fill="#fff"/><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z" fill="#fff"/></svg></span><span class="bn"><i>intel</i>learn</span></div>
<p class="dip">Dip.EP (3)</p>
<h1>ဝင်ခွင့်စာမေးပွဲဖြေဆိုရန်</h1>
<div class="panel">
<div class="row">
<div class="unit"><div class="card"><div class="num" id="d">၀</div></div><div class="lbl">ရက်</div></div>
<div class="colon">:</div>
<div class="unit"><div class="card"><div class="num" id="h">၀</div></div><div class="lbl">နာရီ</div></div>
<div class="colon">:</div>
<div class="unit"><div class="card"><div class="num" id="m">၀</div></div><div class="lbl">မိနစ်</div></div>
<div class="colon">:</div>
<div class="unit"><div class="card"><div class="num" id="s">၀</div></div><div class="lbl">စက္ကန့်</div></div>
</div>
</div>
<p class="tail" id="tail">သာလိုတော့သည်။</p>
<div><p class="when"><b>၁၀.၁၀.၂၀၂၆ (စနေနေ့)</b><br>နံနက် (၉:၀၀) နာရီမှ (၁၁:၀၀) နာရီအထိ</p></div>
<div class="quote" id="q"></div>
<div class="clock">မြန်မာစံတော်ချိန် <span id="clk"></span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="foot"><b>intel</b>learn</div>
</main>
<script>
// မြန်မာစံတော်ချိန် (UTC+06:30)
var START=new Date("2026-10-10T09:00:00+06:30").getTime();
var END=new Date("2026-10-10T11:00:00+06:30").getTime();
// အောက်ဆုံး line စတင်ရွေ့မည့်အချိန် (စာမေးပွဲမတိုင်ခင် ၇ ရက်) - လိုသလို ပြင်ပါ
var PSTART=new Date("2026-10-03T09:00:00+06:30").getTime();
var DAY=86400,HR=3600;
var PH=[
 {min:7*DAY,q:["Every page you study today is a favour your future self will thank you for.","Consistency beats intensity. Show up every day and the results will follow."]},
 {min:3*DAY,q:["The finish line is closer than it feels. Keep your pace steady.","Review, rest, repeat. You are building something nobody can take from you."]},
 {min:1*DAY,q:["Trust the work you've already done. Now sharpen, don't stress.","Calm mind, clear answers. Revise the key points and protect your sleep."]},
 {min:3*HR,q:["Eat well, sleep early, believe in yourself. You are ready.","Tonight, rest is part of studying. Let your mind recharge."]},
 {min:1*HR,q:["Breathe in. You have prepared for this. Walk in with confidence.","Pack your pens, steady your heart. Today is your day."]},
 {min:0,q:["Pens ready. Heart steady. Go and show what you know.","Whatever happens, you showed up and gave your best. That is already a win."]}
];
var DURING=["Read each question carefully. Stay calm, one answer at a time.","Finish strong. Every mark counts, and you've got this!"];
var AFTER=["Well done! Whatever the result, you gave your best. Be proud of yourself."];
var MM="၀၁၂၃၄၅၆၇၈၉";
function mm(n){return String(n).replace(/\d/g,function(c){return MM[c]})}
function $(i){return document.getElementById(i)}
function set(id,v){var e=$(id);if(e.textContent!==v){e.textContent=v;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}}
var fmt=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Yangon",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
var list=[],idx=0,key="";
function showQuote(){var q=$("q");q.classList.add("out");setTimeout(function(){q.textContent="“"+list[idx%list.length]+"”";q.classList.remove("out")},600)}
function setPhase(k,arr){if(k!==key){key=k;list=arr;idx=0;showQuote()}}
function tick(){
  var now=Date.now(),left,tail,pr;
  if(now<START){
    left=Math.floor((START-now)/1000);tail="သာလိုတော့သည်။";
    for(var i=0;i<PH.length;i++){if(left>=PH[i].min){setPhase("p"+i,PH[i].q);break}}
    pr=Math.max(0,Math.min(100,(now-PSTART)/(START-PSTART)*100));
  }else if(now<END){
    left=Math.floor((END-now)/1000);tail="စာမေးပွဲ ဖြေဆိုနေပါပြီ။ ပြီးဆုံးရန် သာလိုတော့သည်။";setPhase("during",DURING);pr=100;
  }else{
    left=0;tail="စာမေးပွဲ ပြီးဆုံးပါပြီ။ ကြိုးစားခဲ့တာ ကျေးဇူးတင်ပါတယ်!";setPhase("after",AFTER);pr=100;
  }
  $("tail").textContent=tail;
  set("d",mm(Math.floor(left/DAY)));set("h",mm(Math.floor(left%DAY/HR)));
  set("m",mm(Math.floor(left%HR/60)));set("s",mm(left%60));
  $("clk").textContent=mm(fmt.format(new Date(now)));
  var f=$("fill");f.style.width=pr+"%";f.classList.toggle("full",pr>=100);
}
tick();setInterval(tick,1000);
setInterval(function(){if(list.length>1){idx++;showQuote()}},15000);
for(var k=0;k<22;k++){var s=document.createElement("div"),z=3+Math.random()*7;s.className="sp";
  s.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(9+Math.random()*10)+"s;animation-delay:-"+Math.random()*14+"s";
  document.body.appendChild(s)}
</script>
</body>
</html>
